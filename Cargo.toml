[package]
name = "native-onnx"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "ONNX inference with system CUDA and TensorRT, reusable buffers, and explicit backend selection"
autoexamples = false
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Near-ring/ONNX-TensorRT-Runtime"
documentation = "https://docs.rs/native-onnx"
keywords = ["onnx", "inference", "tensorrt", "cuda", "machine-learning"]
categories = ["science", "api-bindings", "hardware-support"]
# Keep model assets, repository examples, tests, and SAM3 tools out of releases.
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[features]
default = []
openvino = ["ort/openvino"]

[dependencies]
anyhow = "1.0.104"
half = "2.7.1"
libloading = "0.9.0"
onnx-rs = "0.1.2"
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "load-dynamic",
    "tensorrt",
    "cuda",
    "api-27",
    "half",
] }
serde_json = "1.0.151"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }

[dev-dependencies]
static_assertions = "1.1.0"
